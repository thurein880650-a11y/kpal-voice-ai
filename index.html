<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Cloner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 rounded-xl p-6 shadow-2xl border border-slate-700">
    <h1 class="text-2xl font-bold text-center mb-2 text-indigo-400">AI Voice Cloner</h1>
    <p class="text-slate-400 text-sm text-center mb-6">အသံဖိုင် တင်ပြီး AI အသံတု စတင်ဖန်တီးပါ</p>
    
    <form id="cloneForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Voice Name</label>
        <input type="text" id="voiceName" required placeholder="အသံနာမည် ရိုက်ထည့်ပါ" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Audio Sample (MP3/WAV)</label>
        <input type="file" id="audioFile" accept="audio/*" required class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700">
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 font-semibold py-3 rounded-lg transition duration-200 mt-2 flex items-center justify-center">
        <span id="btnText">Clone Voice</span>
      </button>
    </form>

    <!-- Result / Status Box -->
    <div id="statusBox" class="mt-4 p-3 rounded-lg hidden text-sm text-center"></div>
  </div>

  <script>
    const form = document.getElementById('cloneForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const statusBox = document.getElementById('statusBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('voiceName').value;
      const fileInput = document.getElementById('audioFile');
      const file = fileInput.files[0];

      if (!file) return alert('ကျေးဇူးပြု၍ အသံဖိုင် ရွေးချယ်ပါ');

      // UI Loading state
      submitBtn.disabled = true;
      btnText.innerText = 'အသံတု ဖန်တီးနေပါသည်...';
      statusBox.classList.add('hidden');

      const formData = new FormData();
      formData.append('name', name);
      formData.append('files', file);

      try {
        // ElevenLabs Instant Voice Cloning API Call
        const response = await fetch('/api/clone', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          statusBox.className = 'mt-4 p-3 rounded-lg bg-green-900/50 text-green-300 border border-green-600 text-center text-sm';
          statusBox.innerHTML = `✅ အသံတု အောင်မြင်စွာ ဖန်တီးပြီးပါပြီ!<br><strong>Voice ID:</strong> ${data.voice_id}`;
          statusBox.classList.remove('hidden');
        } else {
          throw new Error(data.error || 'အသံတု ဖန်တီးရာတွင် အမှားအယွင်းရှိနေပါသည်။');
        }
      } catch (err) {
        statusBox.className = 'mt-4 p-3 rounded-lg bg-red-900/50 text-red-300 border border-red-600 text-center text-sm';
        statusBox.innerText = '❌ Error: ' + err.message;
        statusBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.innerText = 'Clone Voice';
      }
    });
  </script>
</body>
</html>
