<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Cloner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 rounded-xl p-6 shadow-2xl border border-slate-700">
    <h1 class="text-2xl font-bold text-center mb-2 text-indigo-400">AI Voice Cloner</h1>
    <p class="text-slate-400 text-sm text-center mb-6">အသံဖိုင် တင်ပြီး AI အသံတု စတင်ဖန်တီးပါ</p>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Voice Name</label>
        <input type="text" placeholder="အသံနာမည် ရိုက်ထည့်ပါ" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Audio Sample (MP3/WAV)</label>
        <input type="file" accept="audio/*" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700">
      </div>

      <button class="w-full bg-indigo-600 hover:bg-indigo-700 font-semibold py-3 rounded-lg transition duration-200 mt-2">
        Clone Voice
      </button>
    </div>
  </div>
</body>
</html>
