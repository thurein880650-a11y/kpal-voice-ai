<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Generator</title>
  <style>
    body { font-family: sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; }
    textarea { width: 100%; height: 100px; padding: 10px; margin: 15px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
    button { background: #4f46e5; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }
    button:disabled { background: #64748b; }
    audio { width: 100%; margin-top: 20px; }
    .error { color: #f87171; margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>AI Voice Generator</h2>
    <p>စာသားထည့်ပြီး အသံဖန်တီးပါ</p>
    <textarea id="textInput" placeholder="ဒီမှာ စာသားရိုက်ပါ..."></textarea>
    <button id="generateBtn" onclick="generateVoice()">အသံထုတ်မည်</button>
    <div id="errorMsg" class="error"></div>
    <audio id="audioPlayer" controls style="display:none;"></audio>
  </div>

  <script>
    async function generateVoice() {
      const text = document.getElementById('textInput').value;
      const btn = document.getElementById('generateBtn');
      const errorMsg = document.getElementById('errorMsg');
      const audioPlayer = document.getElementById('audioPlayer');

      if (!text) {
        errorMsg.innerText = "ကျေးဇူးပြု၍ စာသား ရိုက်ထည့်ပါ";
        return;
      }

      btn.disabled = true;
      btn.innerText = "ဖန်တီးနေသည်...";
      errorMsg.innerText = "";
      audioPlayer.style.display = "none";

      try {
        const response = await fetch('/api/clone', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || "အသံဖန်တီး၍ မရပါ");
        }

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);
        audioPlayer.src = audioUrl;
        audioPlayer.style.display = "block";
        audioPlayer.play();
      } catch (err) {
        errorMsg.innerText = "Error: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "အသံထုတ်မည်";
      }
    }
  </script>
</body>
</html>
