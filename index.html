<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face-Swap & Coffee Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-amber-900 mb-4">AI Face-Swap Studio</h1>
        <p class="text-center text-gray-600 mb-6">မြန်မာ့ရိုးရာဝတ်စုံနှင့် ကော်ဖီပုံစံများဖြင့် ဓာတ်ပုံဖန်တီးကြပါစို့</p>
        
        <div class="mb-4">
            <label class="block text-gray-700 font-medium mb-2">ဓာတ်ပုံတင်ရန် (Upload Photo)</label>
            <input type="file" class="w-full border border-gray-300 rounded-lg p-2" accept="image/*">
        </div>

        <button class="w-full bg-amber-600 text-white font-bold py-3 rounded-lg hover:bg-amber-700 transition">ပုံဖန်တီးမည် (Generate)</button>
        
        <div class="mt-8 border-t pt-4 text-center">
            <h2 class="font-bold text-amber-800">Phoo Traditional Foods & Coffee</h2>
            <p class="text-sm text-gray-500 mt-1">အရသာရှိလှသော Ywangan Coffee ကို ယခုပဲ မှာယူလိုက်ပါ။</p>
        </div>
    </div>
</body>
</html>
